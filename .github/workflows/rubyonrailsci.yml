# This workflow uses actions that are not certified by GitHub.  They are
# provided by a third-party and are governed by separate terms of service,
# privacy policy, and support documentation.
#
# This workflow will install a prebuilt Ruby version, install dependencies, and
# run tests and linters.
name: "Ruby on Rails CI"
on:
  push:
    branches: ["master", "dev"]
  pull_request:
    branches: ["master", "dev"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:11-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
    env:
      RAILS_ENV: test
      SECRET_KEY_BASE_DUMMY: '1'
      PARALLEL_WORKERS: '1'
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - name: Install the pinned Yarn release
        run: npm install --global @yarnpkg/cli-dist@4.18.1
      - name: Install JavaScript dependencies
        run: yarn install --immutable
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Verify the selected Ruby pin
        run: bundle exec ruby -e 'abort "Ruby pin mismatch" unless RUBY_VERSION == File.read(".tool-versions").split.last'
      - name: Set up database schema
        run: bin/rails db:schema:load
      # Precompile assets
      - name: Precompile assets
        run: bin/rails assets:precompile
      # Add or replace test runners here
      - name: Run tests
        run: bundle exec rails test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # Add or replace any other lints here
      - name: Security audit dependencies
        run: bundle exec bundle-audit --update
      - name: Security audit application code
        run: bundle exec brakeman -q -w2
      - name: Lint Ruby files
        run: bundle exec rubocop --parallel
